<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Headwire</title>
<meta name="description" content="Headwire turns an iPad or iPhone into a screen, keyboard and mouse for a Mac.">
<style>
:root {
    --bg: #ffffff;
    --text: #1d1d1f;
    --muted: #5e5e63;
    --rule: #d2d2d7;
    --panel: #f5f5f7;
    --link: #0062cc;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #161618;
        --text: #f2f2f4;
        --muted: #a8a8ae;
        --rule: #3a3a3e;
        --panel: #222225;
        --link: #5fa8ff;
    }
}
:root[data-theme="dark"] {
    --bg: #161618;
    --text: #f2f2f4;
    --muted: #a8a8ae;
    --rule: #3a3a3e;
    --panel: #222225;
    --link: #5fa8ff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
main { max-width: 42rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 0.25rem; }
h2 { font-size: 1.3rem; line-height: 1.3; margin: 2.5rem 0 0.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
h3 { font-size: 1.05rem; margin: 1.5rem 0 0.25rem; }
p, ul, ol { margin: 0 0 1rem; }
ul, ol { padding-left: 1.25rem; }
li { margin-bottom: 0.4rem; }
a { color: var(--link); text-underline-offset: 0.15em; overflow-wrap: anywhere; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }
.updated { color: var(--muted); margin-bottom: 2rem; }
.summary { background: var(--panel); border-radius: 12px; padding: 1rem 1.25rem; }
.summary p:last-child { margin-bottom: 0; }
.address { font-weight: 600; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
footer { color: var(--muted); font-size: 0.95rem; margin-top: 3rem; }
</style>
</head>
<body>
<main>
<header>
<h1>Headwire</h1>
<p class="updated">Use an iPad or iPhone as a screen, keyboard and mouse for your Mac.</p>
</header>
<ul>
<li><a href="helper/">Get Headwire Connect for your Mac</a></li>
<li><a href="support/">Support</a></li>
<li><a href="privacy/">Privacy Policy</a></li>
</ul>
<footer><p>Headwire is by Hung Nguyen.</p></footer>
</main>
</body>
</html>
